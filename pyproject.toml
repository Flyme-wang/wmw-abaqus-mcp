[project]
name = "wmw-abaqus-mcp"
version = "5.2.0"
description = "Multi-port MCP server and Abaqus/CAE GUI socket bridge"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9"]

[tool.uv]
package = false

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["mcp_server", "abaqus_mcp_plugin", "stop_mcp"]
